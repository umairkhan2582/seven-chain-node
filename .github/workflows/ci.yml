name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts (errors only)
        run: |
          SCRIPTS=$(find . -name "*.sh" -not -path "*/node_modules/*")
          if [ -z "$SCRIPTS" ]; then echo "No .sh files — skip"; exit 0; fi
          echo "$SCRIPTS" | xargs shellcheck --severity=error
          echo "All shell scripts passed"

  validate-json:
    name: Validate JSON Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          find . -name "*.json" -not -path "*/node_modules/*" | while read f; do
            python3 -m json.tool "$f" > /dev/null && echo "OK: $f" || exit 1
          done

  validate-docs:
    name: Validate Required Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs exist
        run: |
          for f in README.md VALIDATOR_SETUP.md ONBOARDING.md SECURITY.md; do
            test -f "$f" && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done
