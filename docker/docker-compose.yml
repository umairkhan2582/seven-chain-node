services:
  node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      BOOTNODE_ENODES: "${BOOTNODE_ENODES:-}"
    ports:
      # RPC is reachable only from this host; P2P is exposed for peer traffic.
      - "127.0.0.1:8545:8545"
      - "30303:30303/tcp"
      - "30303:30303/udp"
    volumes:
      - node-data:/data/seven-chain/geth
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST", "-H", "Content-Type: application/json", "--data", "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}", "http://127.0.0.1:8545"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  node-data:
