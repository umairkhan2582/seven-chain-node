version: '3.8'

# Development/test network. RPC ports are intentionally not published to the host.
# Add a reviewed TLS/read-only proxy only when external RPC access is required.
services:
  bootnode:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: seven-chain-bootnode
    ports:
      - "30303:30303"
      - "30303:30303/udp"
    environment:
      VALIDATOR_ADDRESS: "${VALIDATOR_1_ADDRESS}"
    volumes:
      - bootnode-data:/data/seven-chain
      - ./secrets/validator1.pass:/run/secrets/keystore_pass:ro
    networks:
      seven-net:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

  validator-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: seven-chain-validator-1
    environment:
      VALIDATOR_ADDRESS: "${VALIDATOR_1_ADDRESS}"
      BOOTNODE_ENODE: "enode://${BOOTNODE_KEY}@172.20.0.10:30303"
    volumes:
      - validator1-data:/data/seven-chain
      - ./secrets/validator1.pass:/run/secrets/keystore_pass:ro
    networks:
      seven-net:
        ipv4_address: 172.20.0.11
    depends_on:
      - bootnode
    restart: unless-stopped

  validator-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: seven-chain-validator-2
    environment:
      VALIDATOR_ADDRESS: "${VALIDATOR_2_ADDRESS}"
      BOOTNODE_ENODE: "enode://${BOOTNODE_KEY}@172.20.0.10:30303"
    volumes:
      - validator2-data:/data/seven-chain
      - ./secrets/validator2.pass:/run/secrets/keystore_pass:ro
    networks:
      seven-net:
        ipv4_address: 172.20.0.12
    depends_on:
      - bootnode
    restart: unless-stopped

  validator-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: seven-chain-validator-3
    environment:
      VALIDATOR_ADDRESS: "${VALIDATOR_3_ADDRESS}"
      BOOTNODE_ENODE: "enode://${BOOTNODE_KEY}@172.20.0.10:30303"
    volumes:
      - validator3-data:/data/seven-chain
      - ./secrets/validator3.pass:/run/secrets/keystore_pass:ro
    networks:
      seven-net:
        ipv4_address: 172.20.0.13
    depends_on:
      - bootnode
    restart: unless-stopped

volumes:
  bootnode-data:
  validator1-data:
  validator2-data:
  validator3-data:

networks:
  seven-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
